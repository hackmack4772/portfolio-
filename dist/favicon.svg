<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Hackmack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141026"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>
  </defs>

  <!-- Terminal tile -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#8f10b7" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- Shell prompt: chevron + caret. Deliberately chunky so it survives 16px. -->
  <path d="M18 20 L30 32 L18 44" fill="none" stroke="#0cfbff" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M36 43 L47 43" fill="none" stroke="#0cfbff" stroke-width="6" stroke-linecap="round"/>
</svg>
